apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-vaultwarden
  namespace: vaultwarden
spec:
  ingressClassName: traefik
  entryPoints:
    - websecure
  routes:
    - match: Host(`vaultwarden.tmatthews.casa`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
  tls:
    secretName: vaultwarden-tls-cert # Keep this empty. Traefik automatically applies the default TLSStore.
