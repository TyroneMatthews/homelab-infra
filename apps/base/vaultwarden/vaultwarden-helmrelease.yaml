apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 30m
  chart:
    spec:
      chart: vaultwarden
      version: "0.43.x"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: vaultwarden
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: vaultwarden
    domain: "https://tmatthews.casa"
    image:
      tag: "1.34.3"
      
    # 1. ADD EXTRA ENVIRONMENT VARIABLES HERE
    env:
      ROCKET_PORT: "8080"            # Forces Vaultwarden to internal port 8080
    
    websocket:
      enabled: true
    webVaultEnabled: true
    database:
      type: postgresql
      existingSecret: vaultwarden-db-url
      existingSecretKey: database-url
      connectionRetries: 30
      maxConnections: 10
    adminToken:
      existingSecret: vw-secret
      existingSecretKey: ADMIN_TOKEN
    storage:
      data:
        name: vaultwarden-data
        size: 10Gi
        class: ugreen-nfs-sc
        accessMode: ReadWriteOnce
        path: /data
        
    # 2. UPDATE SERVICE TO EXPECT PORT 8080 CONTEXT
    service:
      type: ClusterIP
      port: 8080                     # Maps the service target to 8080
      
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
        
    # 3. PROBES NOW WORK ON / BECAUSE VAULTWARDEN IS LISTENING ON 8080
    livenessProbe:
      enabled: true
      initialDelaySeconds: 20
      timeoutSeconds: 5
      periodSeconds: 30
      successThreshold: 1
      path: /                        # Root path returns 200 OK on port 8080
    readinessProbe:
      enable: true
      path: /                        # Root path returns 200 OK on port 8080
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
