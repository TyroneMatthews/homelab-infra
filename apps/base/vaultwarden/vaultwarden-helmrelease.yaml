apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 30m
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0

chart:
    spec:
      chart: vaultwarden
      version: "0.43.x"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
        namespace: flux-system
      interval: 1h

values:
    fullnameOverride: vaultwarden
    domain: "https://vaultwarden.tmatthews.casa"
    image:
      tag: "1.36.0-alpine"
      
    # CORRECT CONFIG MAPPER FOR THIS HELM CHART
    rocket:
      address: "0.0.0.0"
      port: "8080"
    
    replicas: 1

    websocket:
      enabled: true
    webVaultEnabled: true
    database:
      type: postgresql
      existingSecret: vaultwarden-db-url
      existingSecretKey: database-url
      connectionRetries: 30
      maxConnections: 10
    adminToken:
      existingSecret: vw-secret
      existingSecretKey: ADMIN_TOKEN
    storage:
      data:
        name: vaultwarden-data
        size: 10Gi
        class: ugreen-nfs-sc
        accessMode: ReadWriteOnce
        path: /data
    service:
      type: ClusterIP

    ingress:
      enabled: false
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30        # Increased slightly to give app time to bind
      timeoutSeconds: 5
      periodSeconds: 30
      successThreshold: 1
      path: /
    
    readinessProbe:
      enable: true
      path: /
      initialDelaySeconds: 20        # Increased slightly to give app time to bind
      periodSeconds: 15
      timeoutSeconds: 5
