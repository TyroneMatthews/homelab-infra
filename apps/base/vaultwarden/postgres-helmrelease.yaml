apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-postgresql
  namespace: vaultwarden
spec:
  interval: 30m

  chart:
    spec:
      chart: postgresql
      version: "18.8.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    architecture: standalone

    auth:
      enablePostgresUser: true
      username: vaultwarden
      database: vaultwarden
      existingSecret: vaultwarden-db-secret
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: pgpassword

    primary:
      persistence:
        enabled: true
        size: 10Gi
        # Replace with your actual StorageClass if needed.
        storageClass: ugreen-nfs-sc

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      podSecurityContext:
        enabled: true
        fsGroup: 1001

      containerSecurityContext:
        enabled: true
        runAsUser: 1001
        runAsNonRoot: true

    metrics:
      enabled: false