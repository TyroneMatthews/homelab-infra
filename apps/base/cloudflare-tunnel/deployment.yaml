apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudflared

  template:
    metadata:
      labels:
        app: cloudflared

    spec:
      securityContext:
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "65532 65532"

      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          command:
            - cloudflared
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - --protocol
            - http2
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run

          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token

          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared

          ports:
            - name: metrics
              containerPort: 2000

          livenessProbe:
            httpGet:
              path: /ready
              port: metrics

            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 4

      volumes:
        - name: config
          configMap:
            name: cloudflared-config
