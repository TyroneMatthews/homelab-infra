# test-dns.yaml — throwaway, delete after testing
apiVersion: v1
kind: Namespace
metadata:
  name: dns-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: dns-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: dns-test
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-test
  namespace: dns-test
spec:
  parentRefs:
    - name: internal-gateway        # <-- confirm this matches your Gateway's metadata.name
      namespace: gateway-system   # <-- confirm this matches your Gateway's namespace
  hostnames:
    - test-dns.tmatthews.casa
  rules:
    - backendRefs:
        - name: whoami
          port: 80