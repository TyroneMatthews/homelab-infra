apiVersion: v1
kind: Namespace
metadata:
  name: gateway-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gateway-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gateway-test
spec:
  selector: {app: whoami}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: gateway-test
spec:
  parentRefs:
    - name: internal-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - whoami-staging.tmatthews.casa
  rules:
    - backendRefs:
        - name: whoami
          port: 80