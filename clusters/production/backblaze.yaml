apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backblaze-creds
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./infrastructure/base/backblaze
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system