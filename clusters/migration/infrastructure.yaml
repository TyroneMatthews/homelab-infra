apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration-infra-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./infrastructure/crds/gateway-api
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration-infra-secrets
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./infrastructure/secrets/migration
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration-infra-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: migration-infra-crds
    - name: migration-infra-secrets
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  path: ./infrastructure/migration/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: migration-infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: migration-infra-controllers
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  path: ./infrastructure/migration/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true