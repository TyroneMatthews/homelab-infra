apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - traefik.yaml
  - gatewayclass.yaml
  - referencegrant-cilium-gateway.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: traefik-values
    namespace: traefik
    files:
      - values.yaml