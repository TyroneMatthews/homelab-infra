apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-client
  namespace: nfs-provisioner
spec:
  interval: 30m

  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-client-provisioner
        namespace: nfs-provisioner

  install:
    createNamespace: true

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3

  valuesFrom:
    - kind: ConfigMap
      name: nfs-client-values
      valuesKey: values.yaml
