apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-values
  namespace: traefik
data:
  values.yaml: |
    # -- Additional command arguments to be passed to all traefik's pods

    additionalArguments:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--serversTransport.insecureSkipVerify=true"
      - "--entryPoints.web.transport.lifeCycle.graceTimeOut=30s"
      - "--entryPoints.websecure.transport.lifeCycle.graceTimeOut=30s"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # - "--entrypoints.web.address=:8000"
      # - "--entrypoints.websecure.address=:8443"

    deployment:
      enabled: true
      kind: Deployment
      replicas: 2
      # -- Number of old history to retain to allow rollback (If not set, default Kubernetes value is set to 10)
      revisionHistoryLimit:  # @schema type:[integer, null];minimum:0
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - traefik
              topologyKey: "kubernetes.io/hostname"
      # -- Override the liveness path.
      # Default: /ping
      readinessPath: "/ping"
      livenessPath: "/ping"

      # -- Additional deployment annotations (e.g. for jaeger-operator sidecar injection)
      annotations: {}
      # -- Additional deployment labels (e.g. for filtering deployment by custom labels)
      labels: {}
      podAnnotations: {}
      podLabels: {}
      initContainers: []
      # The "volume-permissions" init container is required if you run into permission issues.
      # Related issue: https://github.com/traefik/traefik-helm-chart/issues/396
      # - name: volume-permissions
      #   image: busybox:latest
      #   command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
      #   volumeMounts:
      #     - name: data
      #       mountPath: /data
      # -- Use process namespace sharing

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    ingressRoute:
      dashboard:
        enabled: true
        
    providers:  # @schema additionalProperties: false
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
      kubernetesIngress:
        # -- Load Kubernetes Ingress provider
        enabled: true
        publishedService:
          enabled: true
          pathOverride: "traefik/traefik"

    log:
      level: "INFO"

    accessLog:
      # -- To enable access logs
      enabled: true

    ports:
      web:
        port: 8000
        # hostPort: 8000
        # containerPort: 8000
        expose:
          default: true
        exposedPort: 80

      websecure:
        ## -- Enable this entrypoint as a default entrypoint. When a service doesn't explicitly set an entrypoint it will only use this entrypoint.
        asDefault: true
        port: 8443
        # expose:
        #   default: true
        exposedPort: 443

    autoscaling:
      # -- Create HorizontalPodAutoscaler object.
      # See EXAMPLES.md for more details.
      enabled: false
      
    # persistence:
    #   # -- Enable persistence using Persistent Volume Claims
    #   # ref: http://kubernetes.io/docs/user-guide/persistent-volumes/.
    #   # It can be used to store TLS certificates along with `certificatesResolvers.<name>.acme.storage`  option
    #   enabled: true
    #   name: data
    #   accessMode: ReadWriteOnce
    #   size: 128Mi
    #   storageClass: ugreen-nfs-sc
    #   path: /data

    # -- If hostNetwork is true, runs traefik in the host network namespace
    # To prevent unschedulable pods due to port collisions, if hostNetwork=true
    # and replicas>1, a pod anti-affinity is recommended and will be set if the
    # affinity is left as default.
    hostNetwork: false

    # -- Whether Role Based Access Control objects like roles and rolebindings should be created
    rbac:  # @schema additionalProperties: false
      enabled: true
      # When set to true:
      # 1. It switches respectively the use of `ClusterRole` and `ClusterRoleBinding` to `Role` and `RoleBinding`.
      # 2. It adds `disableIngressClassLookup` on Kubernetes Ingress with Traefik Proxy v3 until v3.1.4
      # 3. It adds `disableClusterScopeResources` on Ingress and CRD (Kubernetes) providers with Traefik Proxy v3.1.2+
      # **NOTE**: `IngressClass`, `NodePortLB` and **Gateway** provider cannot be used with namespaced RBAC.
      # See [upstream documentation](https://doc.traefik.io/traefik/providers/kubernetes-ingress/#disableclusterscoperesources) for more details.
      namespaced: false
      # Enable user-facing roles
      # https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles
      aggregateTo: []
      # List of Kubernetes secrets that are accessible for Traefik. If empty, then access is granted to every secret.
      # secretResourceNames: []

    service:
      enabled: true
      annotations:
        lbipam.cilium.io/ips: "192.168.40.15"
      labels:
        bgp-advertise: "true"
      ## -- Single service is using `MixedProtocolLBService` feature gate.
      ## -- When set to false, it will create two Service, one for TCP and one for UDP.
      single: true
      type: LoadBalancer
      externalTrafficPolicy: Local
      loadBalancerSourceRanges:
      # - 192.168.0.1/32
      # - 172.16.0.0/16
      ## -- Class of the load balancer implementation
      # loadBalancerClass: service.k8s.aws/nlb
      externalIPs: []
      # - 1.2.3.4