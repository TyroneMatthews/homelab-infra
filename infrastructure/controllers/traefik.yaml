# namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: traefik

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  url: https://traefik.github.io/charts # or oci://ghcr.io/traefik/helm/traefik

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m

  chart:
    spec:
      chart: traefik
      version: 41.0.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik

  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml

  install:
    createNamespace: true

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
