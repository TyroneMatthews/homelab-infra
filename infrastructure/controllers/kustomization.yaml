apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cert-manager.yaml
  - cloudnative-pg.yaml
  - external-dns.yaml
  - local-path-provisioner.yaml
  - nfs-client.yaml
  - traefik.yaml


configMapGenerator:
  - name: traefik-values
    namespace: traefik
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=traefik-values.yaml