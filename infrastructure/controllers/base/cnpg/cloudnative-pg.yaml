apiVersion: v1
kind: Namespace
metadata:
  name: cloudnative-pg
  labels:
    app.kubernetes.io/name: cloudnative-pg

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  interval: 12h
  url: https://cloudnative-pg.github.io/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  interval: 30m

  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cloudnative-pg

  install:
    crds: Create

  upgrade:
    crds: CreateReplace