apiVersion: v1
kind: Namespace
metadata:
  name: nfs-provisioner

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-client-provisioner
  namespace: nfs-provisioner
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-client
  namespace: nfs-provisioner
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-client-provisioner
        namespace: nfs-provisioner

  values:
    nfs:
      server: 192.168.75.250
      path: /volume1/k8s

    storageClass:
      create: true
      name: ugreen-nfs-sc
      reclaimPolicy: Retain
      archiveOnDelete: true
      allowVolumeExpansion: true
      accessModes:
        - ReadWriteOnce
      volumeBindingMode: Immediate
      mountOptions:
        - nolock
        - nfsvers=3
        - tcp

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3