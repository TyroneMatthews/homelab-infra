apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../configs/base/traefik
  - ../../configs/base/cilium-gateway
  - ./cilium-gateway
  - ./traefik

patches:
  - target:
      kind: Gateway
      name: internal-gateway
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: internal-gateway
        namespace: gateway-system
      spec:
        infrastructure:
          labels:
            bgp-advertise: "production"      # or "production" on the other cluster