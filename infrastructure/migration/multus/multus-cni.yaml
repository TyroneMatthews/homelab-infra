apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: multus-cni
  namespace: kube-system
spec:
  interval: 1h
  url: https://startechnica.github.io/apps

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus-release
  namespace: kube-system
spec:
  chart:
    spec:
      chart: multus-cni
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: multus-cni
      version: "0.1.4"
  interval: 1h
  values:
    image:
      registry: ghcr.io
      repository: k8snetworkplumbingwg/multus-cni
      tag: "latest-thick"

    resources:
      ## Example:
      ## limits:
      ##    cpu: 0.5
      ##    memory: 256Mi
      limits:
        cpu: "300m"
        memory: "150Mi"
      ## Examples:
      ## requests:
      ##    cpu: 0.5
      ##    memory: 256Mi
      requests:
        cpu: "200m"
        memory: "100Mi"
