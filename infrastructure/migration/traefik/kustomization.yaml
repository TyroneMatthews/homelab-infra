apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/traefik
  - dashboard-ingress.yaml
  - service.yaml

configMapGenerator:
  - name: traefik-values
    namespace: traefik
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml=traefik-values.yaml